<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page-load lab</title>
<style>
body { font:1rem/1.55 system-ui,sans-serif; color:#1d2938; background:#f6f8fb; margin:0; }
main { max-width:53rem; margin:auto; padding:2rem 1rem 4rem; }
form { display:grid; gap:.45rem; padding:1rem; background:#e7eff7; border-radius:.5rem; }
button, select { padding:.2rem .4rem; font:inherit; } output { display:block; margin:1rem 0; font-weight:650; }
table { border-collapse:collapse; width:100%; } caption { text-align:left; color:#214a68; font-weight:650; }
th, td { text-align:left; padding:.35rem; border-block-end:1px solid #d6dfe8; }
.track { position:relative; width:38%; }
.track span { position:absolute; background:#23677a; min-width:2px; inset-block:30%; border-radius:2px; }
@media (max-width:36rem) { .track { display:none; } }
</style>
</head>
<body><main>
<h1>What held up the departures?</h1>
<p>Predict when the styled list appears. Compare the full cold load with the warm load, then change one assumption.</p>
<form>
<div><button type="button" value="cold">Cold load</button> <button type="button" value="warm">Warm load</button></div>
<label><input type="checkbox" name="linkReady"> Wi-Fi, lease, and gateway entry already usable</label>
<label><input type="checkbox" name="dnsWarm"> Host has a valid DNS answer</label>
<label><input type="checkbox" name="connectionOpen"> Browser can reuse its open connection</label>
<label><input type="checkbox" name="assetsFresh"> Stylesheet, logo, and script are fresh in the HTTP cache</label>
<label>API response time <select name="apiTime"><option>40</option><option selected>55</option><option>90</option><option>140</option></select> ms</label>
</form>
<output aria-live="polite"></output>
<table><caption>Modeled waterfall</caption><thead><tr><th scope="col">Stage</th><th scope="col">Start</th><th scope="col">End</th><th class="track" aria-hidden="true">Elapsed time</th></tr></thead><tbody></tbody></table>
</main><script defer src="load-lab.js"></script></body>
</html>
