<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crossbar lab</title>
  <style>
    html {color-scheme:light;color:#162436;background:#f6f8fa;font:1rem/1.5 system-ui,sans-serif}
    body {max-width:54rem;margin:2rem auto;padding:0 1rem}
    form {display:flex;flex-wrap:wrap;align-items:end;gap:.75rem}
    label {display:grid;gap:.2rem}
    input,select,button {font:inherit;padding:.35rem .55rem}
    input {width:6rem;text-transform:uppercase}
    a {color:#225881}
    button {color:white;background:#15384e;border:2px solid #15384e;border-radius:.25rem}
    .table-scroll {overflow-x:auto}
    table {border-collapse:collapse;width:100%;text-align:left}
    caption {text-align:left;font-weight:bold;padding:.75rem 0 .35rem}
    th,td {padding:.45rem;border-bottom:1px solid #c6d0d9}
  </style>
  <script src="switch-lab.js" defer></script>
</head>
<body>
  <main>
    <a href="../../build/15-inside-a-high-speed-switch.html">Chapter 15</a>
    <h1>Crossbar lab</h1>
    <p>Give each input up to 12 packets, in arrival order, with one letter per destination. The output letters are A, B, and C. All listed packets begin in storage.</p>
    <form id="settings">
      <label>Input 1 <input id="input-1" value="AB" maxlength="12" pattern="[ABCabc]*"></label>
      <label>Input 2 <input id="input-2" value="A" maxlength="12" pattern="[ABCabc]*"></label>
      <label>Input 3 <input id="input-3" maxlength="12" pattern="[ABCabc]*"></label>
      <label>Input queues <select id="queues"><option value="fifo">FIFO</option><option value="voq">Virtual output queues</option></select></label>
      <label>Scheduler <select id="scheduler"><option value="greedy">Greedy</option><option value="maximum">Maximum size</option></select></label>
      <button>Run trace</button>
    </form>
    <p id="summary" role="status"></p>
    <div class="table-scroll" tabindex="0" role="region" aria-label="Fabric trace">
      <table>
        <caption>Fabric trace</caption>
        <thead><tr><th scope="col">Slot</th><th scope="col">Visible requests</th><th scope="col">Grants</th><th scope="col">Packets left by input</th></tr></thead>
        <tbody id="trace"></tbody>
      </table>
    </div>
  </main>
</body>
</html>
